<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extra Page - Todo List Frontend</title>
    <meta name="description" content="Standalone HTML page served by the React app's public folder." />
    <style>
      :root {
        --bg: #f9fafb;
        --surface: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --primary: #3b82f6;
        --ring: rgba(59, 130, 246, 0.25);
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      .wrap {
        max-width: 860px;
        margin: 48px auto;
        padding: 0 16px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.06);
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 16px 0;
        color: var(--muted);
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--surface);
      }

      a.button.primary {
        background: var(--primary);
        color: white;
        border-color: transparent;
      }

      a.button:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.95em;
        color: var(--text);
      }

      .hint {
        font-size: 14px;
        margin-top: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Extra HTML Page</h1>
        <p>
          This file is served from <code>public/extra.html</code>. It is independent of the React
          bundle and can be opened directly at <code>/extra.html</code>.
        </p>

        <div class="row" role="navigation" aria-label="Quick links">
          <a class="button primary" href="/">Go to React App</a>
          <a class="button" href="/index.html">Open index.html</a>
        </div>

        <p class="hint">
          Tip: Place other static assets (images, documents) under <code>public/</code> to serve
          them directly without importing into React.
        </p>
      </section>
    </main>
  </body>
</html>
